# Phase 0 登录 demo；已迁移到 strict schema 0.2，与正式用例共用 lint / 新管线。
schema_version: "0.2"
id: login_demo_001
name: 登录 Demo（Phase 0 验收用例）

precondition:
  reset: REINSTALL
  app_path: "~/Library/Developer/Xcode/DerivedData/LoginDemo-ctemhqejzgzbnqhigvxhleqcmbjj/Build/Products/Debug-iphonesimulator/LoginDemo.app"

steps:
  - action: launch_app

  - action: input
    target: LoginView.username_field
    value: "${TEST_USERNAME}"

  - action: input
    target: LoginView.password_field
    value: "${TEST_PASSWORD}"
    sensitive: true

  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT

  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10

  - assertion:
      target: HomeView.home_page
      condition: exists
      timeout: 5
