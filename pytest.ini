[pytest]
testpaths = tests
addopts = -q
# R18-1（2 次复现的 flake）：Python warnings 按
# (message, category, lineno) 在 __warningregistry__ 去重——同模块内前一个
# 测试已触发过 trace write failed warn 后，后续 pytest.warns 捕获不到
# （同进程 registry 复用），表现为「隔离跑绿、全量随机红」。
# 显式 always：warn 断言与执行历史解耦，CI 不再随机红。
filterwarnings =
    always
