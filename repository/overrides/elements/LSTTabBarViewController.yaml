# overrides/elements/LSTTabBarViewController.yaml — 乐速通底部 tab
#
# 真机探测（2026-10-17）：三个 tab 按钮的 name/label 与标题一致；服务页
# 顶部 NavigationBar/标题也叫「服务」，所以必须用 Button predicate 限定
# 类型。`畅行慧览` 也会出现在 tab 栏中，但本用例只覆盖稳定的首页/服务/我的。
# 2026-10-18 补齐第四个 tab：真机 dump 确认「畅行慧览」同为 Button 且
# name/label 与标题一致，仍用 Button predicate 限定——畅行慧览页自己的
# NavigationBar 标题也是「畅行慧览」（见 screens/ 那份的注释）。
schema_version: "1.0"
kind: element
id: tab_home
screen: LSTTabBarViewController
type: button
strategies:
  - {type: predicate,
     value: 'type == "XCUIElementTypeButton" AND name == "首页"',
     origin: manual}
metadata:
  risk: LOW
  idempotency: IDEMPOTENT
  data_class: PUBLIC
