# overrides/screens/LSTHomeViewController.yaml — 乐速通首页 Screen 定义
# （2026-10-15 接入）：marker 必须指向**真机上可见的 accessibility id**。
# generated 侧的 screen marker 是 `screen.<类名>`（export 策略，永远匹配不到
# 真机节点——见 source/export.py 的教训注释），故 LST 的 screen 一律由
# overrides 声明。id 与 generated 元素的 container_type（@implementation
# 类名）一致，便于 `screen: LSTHomeViewController.home_list` 形式引用。
#
# ⚠️ 2026-10-16 真机实测：原 marker `home_list` **在无障碍树里根本不存在**，
# 已改用首页搜索框的占位文案。原锚点失效的完整原因见
# docs/lst_update_playbook.md §3.11——一句话版本：`accessibilityIdentifier`
# 设在**容器**（UITableView）上，而 XCUITest 不把容器当可定位节点暴露
# （实测整棵树连一个 XCUIElementTypeTable 都没有，列表由 ScrollView/
# CollectionView 承载，且这些容器的 name 全是空串）。
schema_version: "1.0"
kind: screen
id: LSTHomeViewController
marker: 请输入「关键词」搜索
kind_hint: page
metadata:
  risk: LOW
  origin: manual
