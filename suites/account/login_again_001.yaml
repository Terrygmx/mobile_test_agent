# suites/account/login_again_001.yaml — P1-08：登录→登出→再登录
# postcondition 真执行（H7 闭环首次在 account 套件亮相）：logout 是
# NON_IDEMPOTENT 且带 postcondition:screen:LoginView active，恢复判定
# 有据可依（此前该字段被 lint 拦、runner 不消费）。
schema_version: "0.2"
id: login_again_001
name: 登出后再登录
suite: account
tags: [account, login, logout, postcondition]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - action: tap
    target: HomeView.go_profile
  - wait_for:
      target: screen:ProfileView
      condition: active
      timeout: 10
  - action: tap
    target: ProfileView.logout_button
    idempotency: NON_IDEMPOTENT
    postcondition:
      target: screen:LoginView
      condition: active
      timeout: 10
  - wait_for:
      target: screen:LoginView
      condition: active
      timeout: 10
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - assertion:
      target: HomeView.welcome_label
      condition: exists
      timeout: 5
