# suites/lst/smoke_launch_001.yaml — 乐速通冒烟：冷启动 → 首页可见
#
# 2026-10-16 真机实测修订（三处，都是 dump 无障碍树/读源码核出来的，不是猜的）：
# ① screen 从 `LSTHomeViewController` 换成 `LSTDynamicHomeViewController`。
#    前者是**死代码**——全仓无 alloc/init/new、无 storyboard/xib 引用、无
#    NSClassFromString，首页 tab 的真身是后者
#    （Control/LSTTabBarViewController.m:66）。原先加在死类上的
#    `home_list` 锚点因此从未生效过（不是「容器不被 XCUITest 暴露」那么简单）。
#    新 marker `home_search` 由 App 写死在搜索按钮内部的 UILabel 上，
#    **不是服务端下发的文案**——上一版用搜索框占位文案，运营改一次字就假红。
#    最初设在外部 UIButton 上，真机 dump 显示按钮节点没有 identifier；
#    改到叶子 UILabel 后查找唯一命中。
#    详见 playbook §3.11。
# ② 保留 optional 的「取消更新弹窗」步。冷启动后 uat 服务器会弹「更新提示」
#    （服务器 4.2.31 > 装机 4.2.30），模态弹窗把首页内容全部置成
#    visible=false——不点掉，任何首页断言都过不了（实测点掉前可见且有名的
#    节点只有 7 个、全是弹窗自己的；点掉后 43 个）。App 追上版本后不再弹，
#    所以该步 optional：没弹就跳过，不会假红。
schema_version: "0.2"
id: lst_smoke_launch_001
name: 乐速通冷启动后首页可见
suite: lst_smoke
tags: [lst, smoke]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: tap
    target: update_dialog_cancel
    optional: true
  - wait_for:
      target: screen:LSTDynamicHomeViewController
      condition: active
      timeout: 15
