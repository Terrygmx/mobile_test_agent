# suites/smoke/logout_001.yaml — P1-04：退出登录（前置：已登录）
schema_version: "0.2"
id: logout_001
name: 退出登录
suite: smoke
tags: [smoke, logout]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - action: tap
    target: HomeView.go_profile
  - wait_for:
      target: screen:ProfileView
      condition: active
      timeout: 10
  - action: tap
    target: ProfileView.logout_button
    idempotency: NON_IDEMPOTENT
    # postcondition（screen:LoginView active）待 M2 postcondition 引擎落地后
    # 加回——当前 runner 不消费（R10-2 lint declaration_not_consumed 会拦）。
    # 终态回 Login 由 Gate 脚本的 marker 精确断言覆盖。
