# suites/smoke/open_detail_001.yaml — P1-04：首页 cell → 详情
schema_version: "0.2"
id: open_detail_001
name: 打开详情页
suite: smoke
tags: [smoke, detail]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - action: tap
    target: HomeView.cell_beta
  - wait_for:
      target: screen:DetailView
      condition: active
      timeout: 10
  - assertion:
      target: DetailView.detail_item_key
      condition: exists
      timeout: 5
