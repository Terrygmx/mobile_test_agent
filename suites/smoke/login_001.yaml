# suites/smoke/login_001.yaml — P1-04：登录主路径（设计 6 示例形态）
schema_version: "0.2"
id: login_001
name: 登录主路径
suite: smoke
tags: [smoke, login]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    # 显式声明（设计 6 示例）：重复点击登录不产生额外副作用
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
