# suites/search/search_002.yaml — P1-08：search_field 文本条件（text_equals）
# 覆盖 6.2 wait 条件矩阵的 text_equals：空查询 → 全量；验证输入框清空后文本
schema_version: "0.2"
id: search_002
name: 搜索框文本清空
suite: search
tags: [search]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - action: tap
    target: HomeView.go_search
  - wait_for:
      target: screen:SearchView
      condition: active
      timeout: 10
  - action: input
    target: SearchView.search_field
    value: Gamma
  - action: input
    target: SearchView.search_field
    value: ""
  # XCUITest 实测：SwiftUI TextField 的 .text 清空后回到 **placeholder**
  # （原 probe_text 探针实锤：输入 'Gamma' → 'Gamma'，clear → '关键词'）。
  # 等 placeholder 即证明输入框已被清空——text_equals: "" 恒假（App 行为
  # 如此，非缺陷），这是可观测的等价判据。
  - wait_for:
      target: SearchView.search_field
      condition: text_equals
      expected: 关键词
      timeout: 5
