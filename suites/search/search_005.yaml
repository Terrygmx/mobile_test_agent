# suites/search/search_005.yaml — P1-08：文本条件 text_contains 真值。
# search_field 输入后其 value 属性包含子串（覆盖 wait 的 text_contains 分支）。
schema_version: "0.2"
id: search_005
name: 搜索关键词命中
suite: search
tags: [search]
precondition:
  reset: RELAUNCH
steps:
  - action: launch_app
  - action: input
    target: LoginView.username_field
    value: ${TEST_USERNAME}
  - action: input
    target: LoginView.password_field
    value: ${TEST_PASSWORD}
    sensitive: true
  - action: tap
    target: LoginView.login_button
    idempotency: IDEMPOTENT
  - wait_for:
      target: screen:HomeView
      condition: active
      timeout: 10
  - action: tap
    target: HomeView.go_search
  - wait_for:
      target: screen:SearchView
      condition: active
      timeout: 10
  - action: input
    target: SearchView.search_field
    value: Alpha
  - wait_for:
      target: SearchView.search_field
      condition: text_contains
      expected: Alp
      timeout: 5
